[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "naratrace"
version = "0.1.0"
description = "Lokale, quellennahe Personensuche im National Archives Catalog"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "NARATrace contributors" }
]
dependencies = [
  "alembic>=1.13,<2.0",
  "fastapi>=0.100,<1.0",
  "httpx>=0.27,<1.0",
  "keyring>=25,<27",
  "pillow>=10,<13",
  "platformdirs>=4.2,<5.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "pypdfium2>=4.30,<5.0",
  "pytesseract>=0.3,<0.4",
  "python-multipart>=0.0.9,<1.0",
  "rapidfuzz>=3.9,<4.0",
  "reportlab>=4.0,<5.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2"
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2"
]

[project.scripts]
naratrace = "naratrace.launcher.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["naratrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "error"
]
